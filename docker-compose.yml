services:
  postgres:
    image: postgres:16-alpine
    container_name: pratibha-postgres
    environment:
      POSTGRES_USER: pratibha
      POSTGRES_PASSWORD: pratibha
      POSTGRES_DB: pratibha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
