# Pratibha agent. Two things here are load-bearing.
#
# 1. The WebSocket carries a live phone call. The default 60s proxy_read_timeout
#    kills a screening at the one-minute mark, which is right about when the
#    first real question is being answered.
# 2. Plivo signs the URL it was configured to call. Behind this proxy the app
#    sees http:// and an internal host, so the forwarding headers below are what
#    let signature validation reconstruct the public URL. Drop them and every
#    call is rejected as unsigned.

location /pratibha/stream {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # A screening runs 10-15 minutes; allow for a long answer with no traffic
    # from our side.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_buffering off;
}

location /pratibha/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /health {
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
}
