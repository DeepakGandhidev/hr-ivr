# The whole stack, for someone who has just cloned the repo.
#
#   cp .env.docker.example .env.docker
#   docker compose -f docker-compose.dev.yml up
#
# Deliberately a development setup: source is bind-mounted and both services
# hot-reload, because the alternative - rebuilding an image per edit - is not
# something anyone will tolerate twice.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pratibha
      POSTGRES_PASSWORD: pratibha
      POSTGRES_DB: pratibha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on an empty data directory only. If you change it later you
      # must `docker compose down -v` for it to take effect again.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pratibha -d pratibha"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Supabase's auth server, run directly rather than through the Supabase CLI,
  # so a colleague needs Docker and nothing else installed.
  auth:
    image: supabase/gotrue:v2.177.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:supabase_auth_admin@postgres:5432/pratibha?search_path=auth&sslmode=disable
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000,http://localhost:3000/*
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      # No SMTP locally: accounts confirm themselves, so nobody has to fish a
      # verification link out of a mail catcher to log in.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    ports:
      - "9999:9999"

  # Reads the schema for Studio. Studio talks to this, not to Postgres.
  pg-meta:
    image: supabase/postgres-meta:v0.84.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: postgres
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: pratibha
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: postgres

  # The Supabase table editor and SQL runner.
  #
  # Only the database features work here: this app uses Supabase for auth and
  # nothing else, so there is no PostgREST or Storage behind the API-shaped
  # tabs. Table editor, SQL editor and the schema browser are the point.
  studio:
    image: supabase/studio:2025.06.30-sha-6f5982d
    depends_on:
      - pg-meta
    environment:
      STUDIO_PG_META_URL: http://pg-meta:8080
      POSTGRES_PASSWORD: postgres
      DEFAULT_ORGANIZATION_NAME: Pratibha
      DEFAULT_PROJECT_NAME: pratibha
      SUPABASE_URL: http://auth:9999
      SUPABASE_PUBLIC_URL: http://localhost:54323
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      NEXT_PUBLIC_ENABLE_LOGS: "false"
    # The shipped healthcheck can never pass self-hosted, for two separate
    # reasons: it calls /api/platform/profile, which only exists on Supabase's
    # hosted platform, and it calls it on localhost, while Studio binds solely
    # to the container's hostname interface - loopback is refused. A container
    # permanently marked unhealthy sends people hunting a bug that is not there,
    # so this checks the root path on the interface Studio actually listens on.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://'+require('os').hostname()+':3000/').then(r=>{if(r.status>=400)throw new Error(r.status)})\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "54323:3000"

  # Catches every outbound email instead of delivering it, so invite and
  # rejection mail can be read locally with no Resend key and no risk of
  # actually mailing a candidate from a dev machine.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

  # Applies migrations, then exits. Both services wait for it, so neither ever
  # starts against a schema that does not exist yet.
  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pratibha:pratibha@postgres:5432/pratibha
    command: sh -c "cd packages/prisma && npx prisma migrate deploy"

  worker:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgres://pratibha:pratibha@postgres:5432/pratibha
      PORT: "8091"
    ports:
      - "8091:8091"
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      # Anonymous volumes: keep the image's installed tree, so the host's
      # node_modules (or absence of one) does not shadow it.
      - /app/node_modules
      - /app/packages/prisma/src/generated
      - /app/packages/shared/dist
    command: npm run dev -w @pratibha/worker

  web:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgres://pratibha:pratibha@postgres:5432/pratibha
      APP_DATABASE_URL: postgres://pratibha_app:pratibha_app@postgres:5432/pratibha
    ports:
      - "3000:3000"
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/.next
      - /app/packages/prisma/src/generated
      - /app/packages/shared/dist
    command: npm run dev -w @pratibha/web

volumes:
  postgres_data:
